[project]
name = "fall-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "mediapipe==0.10.21",
    "numpy>=1.26.4",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "torch==2.11.0",
    "tqdm>=4.70.1",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true